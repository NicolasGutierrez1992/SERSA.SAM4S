name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db_sersa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ci_test_password
      DB_NAME: db_sersa_test
      DB_SSL: 'false'
      JWT_SECRET: ci-test-secret-not-for-production-use-only
      ENCRYPTION_KEY: ci0123456789abcdef0123456789abcdef01234567
      CORS_ORIGINS: http://localhost:3000
      DEFAULT_USER_PASSWORD: ci-default-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Tests E2E (Jest + Supertest, contra Postgres efímero del job)
        run: npm run test:e2e
        working-directory: backend

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: E2E — Playwright contra el stack completo (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Generar backend/.env.docker para CI (solo valores dummy, no productivos)
        run: |
          cat > backend/.env.docker <<'EOF'
          PORT=3001
          NODE_ENV=development
          DB_HOST=db
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=ci_test_password
          DB_NAME=db_sersa
          DB_SSL=false
          JWT_SECRET=ci-test-secret-not-for-production-use-only
          ENCRYPTION_KEY=ci0123456789abcdef0123456789abcdef01234567
          CORS_ORIGINS=http://localhost:3010
          THROTTLE_TTL=60
          THROTTLE_LIMIT=100
          DEFAULT_USER_PASSWORD=ci-default-password
          MOCK_MODE=true
          EOF

      - name: Levantar stack (db + backend + frontend)
        run: docker compose up -d --build
        env:
          POSTGRES_PASSWORD: ci_test_password

      - name: Esperar a que el backend esté healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3011/api/health > /dev/null; then
              echo "Backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "Backend no respondió a tiempo"; docker compose logs backend; exit 1

      - name: Sembrar usuarios de prueba (admin + distribuidor, efímeros en esta base descartable)
        run: |
          ADMIN_HASH=$(docker compose exec -T backend node -e "console.log(require('bcrypt').hashSync(process.env.E2E_ADMIN_PASSWORD, 12))")
          DISTRI_HASH=$(docker compose exec -T backend node -e "console.log(require('bcrypt').hashSync(process.env.E2E_DISTRIBUIDOR_PASSWORD, 12))")
          docker compose exec -T db psql -U postgres -d db_sersa -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO mayoristas (id_mayorista, nombre) OVERRIDING SYSTEM VALUE VALUES (1, 'SERSA') ON CONFLICT DO NOTHING;
          INSERT INTO users (nombre, cuit, mail, password, id_rol, id_mayorista, status, must_change_password, limite_descargas, tipo_descarga)
          VALUES ('E2E Admin', '${E2E_ADMIN_CUIT}', 'e2e-admin@example.com', '${ADMIN_HASH}', 1, 1, 1, false, 0, 'CUENTA_CORRIENTE')
          ON CONFLICT (cuit) DO NOTHING;
          INSERT INTO users (nombre, cuit, mail, password, id_rol, id_mayorista, status, must_change_password, limite_descargas, tipo_descarga)
          VALUES ('E2E Distribuidor', '${E2E_DISTRIBUIDOR_CUIT}', 'e2e-distri@example.com', '${DISTRI_HASH}', 3, 1, 1, false, 5, 'CUENTA_CORRIENTE')
          ON CONFLICT (cuit) DO NOTHING;
          SQL
        env:
          E2E_ADMIN_CUIT: '00000000000'
          E2E_ADMIN_PASSWORD: 'E2E-Test-Admin-2026!'
          E2E_DISTRIBUIDOR_CUIT: '11111111111'
          E2E_DISTRIBUIDOR_PASSWORD: 'E2E-Test-Distri-2026!'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Correr E2E de Playwright
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3010
          E2E_ADMIN_CUIT: '00000000000'
          E2E_ADMIN_PASSWORD: 'E2E-Test-Admin-2026!'
          E2E_DISTRIBUIDOR_CUIT: '11111111111'
          E2E_DISTRIBUIDOR_PASSWORD: 'E2E-Test-Distri-2026!'

      - name: Logs del stack (si algo falló)
        if: failure()
        run: docker compose logs

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
