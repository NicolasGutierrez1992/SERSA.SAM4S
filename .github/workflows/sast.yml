name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes a las 06:00 UTC — corre igual aunque no haya pushes esa semana
    - cron: '0 6 * * 1'

jobs:
  eslint-security:
    name: ESLint (eslint-plugin-security) — backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: backend

      - name: ESLint (no bloquea el pipeline — informativo, ver .eslintrc.js)
        run: npx eslint "{src,test}/**/*.ts" --format stylish
        working-directory: backend
        continue-on-error: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
